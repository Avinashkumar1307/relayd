name: CI

# Every pull request, and main itself so the branch protection check has a
# baseline. Budget for the whole workflow is 8 minutes (BUILD-PLAN Phase 0),
# which is why the four checks run as parallel jobs rather than one script.
on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CLAUDE.md section 2 locks Node 22 LTS.
  NODE_VERSION: '22'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes the five custom architecture rules, as errors
      # (CLAUDE.md section 7).
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc -b across the workspace, plus the test files.
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # GitHub sets CI already. It is stated here because the integration
      # suite's behaviour hangs off it: with CI set, an unreachable Docker
      # daemon throws instead of skipping, so this must not depend on a
      # runner default staying what it is today.
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The workspace packages resolve through their dist entry points, so
      # tests exercise what actually ships rather than src.
      - name: Build workspace packages
        run: pnpm turbo run build

      # This is `pnpm test` with an extra JSON reporter, so the next step can
      # inspect what actually ran. Testcontainers uses the runner's daemon.
      - name: Unit and integration tests
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=.vitest-results.json

      # The suite policing itself is not enough. If the CI guard regressed, or
      # a file stopped matching the naming convention, or someone added .skip,
      # the job above would go green having tested nothing — a skipped
      # integration suite looks exactly like a passing one in every signal CI
      # produces. This checks from outside and fails the job on any skip.
      - name: Integration tests must have run, not skipped
        run: node scripts/assert-integration-ran.mjs .vitest-results.json

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
